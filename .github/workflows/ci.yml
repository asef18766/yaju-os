name: Build, test, and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: hitcon-legacy-dfu:ci

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build deployment image
        run: docker build --tag "${CI_IMAGE}" .

      - name: Run complete test suite
        run: |
          docker run --rm \
            --entrypoint python \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env PYTHONPATH=/workspace/src \
            "${CI_IMAGE}" \
            -m unittest discover -s tests -v

      - name: Extract compiled player runtime artifacts
        run: |
          mkdir -p build/ci-handout
          container_id=$(docker create "${CI_IMAGE}")
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "${container_id}:/app/handout/maintenance_application.bin" \
            build/ci-handout/maintenance_application.bin
          docker cp \
            "${container_id}:/app/artifacts/board_runtime/board_flash.bin" \
            build/ci-handout/board_flash.bin
          docker cp \
            "${container_id}:/app/artifacts/board_runtime/runtime_symbols.json" \
            build/ci-handout/runtime_symbols.json
          docker rm "${container_id}"
          trap - EXIT

      - name: Package release ZIP files
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          SOURCE_DATE_EPOCH="${source_date_epoch}" python3 scripts/package_release.py \
            --handout build/ci-handout/maintenance_application.bin \
            --board-flash build/ci-handout/board_flash.bin \
            --runtime-symbols build/ci-handout/runtime_symbols.json \
            --output-dir dist \
            --revision "${GITHUB_SHA}"

      - name: Verify both release bundles
        run: |
          mkdir -p build/archive-smoke/attachment build/archive-smoke/service
          python3 -m zipfile -e \
            dist/hitcon-legacy-dfu-attachment.zip \
            build/archive-smoke/attachment
          python3 -m zipfile -e \
            dist/hitcon-legacy-dfu-service.zip \
            build/archive-smoke/service
          cmp \
            build/ci-handout/maintenance_application.bin \
            build/archive-smoke/attachment/maintenance_application.bin
          cmp \
            build/ci-handout/board_flash.bin \
            build/archive-smoke/attachment/artifacts/board_runtime/board_flash.bin
          cmp \
            build/ci-handout/runtime_symbols.json \
            build/archive-smoke/attachment/artifacts/board_runtime/runtime_symbols.json
          (cd build/archive-smoke/attachment && sha256sum --check SHA256SUMS)
          (cd build/archive-smoke/service/hitcon-legacy-dfu-service && sha256sum --check SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          docker compose \
            --file build/archive-smoke/service/hitcon-legacy-dfu-service/compose.yaml \
            config --quiet
          docker build \
            --tag hitcon-legacy-dfu:archive-smoke \
            build/archive-smoke/service/hitcon-legacy-dfu-service

      - name: Boot attachment lab and read GATT over Bluetooth
        working-directory: build/archive-smoke/attachment
        run: |
          project=attachment-smoke
          export HCI_PORT=16402
          cleanup() {
            docker compose --project-name "${project}" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose --project-name "${project}" config --quiet
          docker compose --project-name "${project}" build
          docker compose --project-name "${project}" up --detach host

          probe_output=''
          for attempt in 1 2 3 4 5; do
            if probe_output=$(docker compose --project-name "${project}" run --rm --no-deps tools probe.py); then
              break
            fi
            if [[ "${attempt}" == 5 ]]; then
              docker compose --project-name "${project}" logs host
              exit 1
            fi
            sleep 1
          done
          printf '%s\n' "${probe_output}"
          grep --fixed-strings \
            'local target OK: read 125 bytes over GATT' \
            <<<"${probe_output}"

          # This solution-bearing smoke client is copied only after the ZIP's
          # manifest/scope checks and is never part of either release bundle.
          cp "${GITHUB_WORKSPACE}/scripts/smoke_player_attachment.py" \
            workspace/organizer-smoke.py
          exploit_output=$(docker compose --project-name "${project}" run \
            --rm --no-deps tools organizer-smoke.py)
          printf '%s\n' "${exploit_output}"
          grep --fixed-strings \
            "local exploit OK: recovered b'CTF{local_emulator_test_flag}\\n'" \
            <<<"${exploit_output}"

      - name: Upload release bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hitcon-legacy-dfu-${{ github.sha }}
          path: |
            dist/hitcon-legacy-dfu-attachment.zip
            dist/hitcon-legacy-dfu-service.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hitcon-legacy-dfu-${{ github.sha }}
          path: release

      - name: Verify downloaded release bundles
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release/hitcon-legacy-dfu-attachment.zip \
              release/hitcon-legacy-dfu-service.zip \
              release/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release/hitcon-legacy-dfu-attachment.zip \
              release/hitcon-legacy-dfu-service.zip \
              release/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "HITCON legacy DFU ${GITHUB_REF_NAME}"
          fi
