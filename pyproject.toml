[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaju-os"
version = "0.1.11"
description = "A testable emulated nRF51 BLE challenge target"
requires-python = ">=3.12"

[project.scripts]
yaju-os = "yaju_os.runner:main"
yaju-os-host = "yaju_os.session_host:main"

[project.optional-dependencies]
emulator = [
  "qiling @ git+https://github.com/qilingframework/qiling.git@86c927cb329993b14e2586e04d1dd7a90deee5fb",
  "unicorn==2.1.3",
]
transport = [
  "bumble==0.0.235",
  "rootcanal==1.13.0",
]
full = [
  "qiling @ git+https://github.com/qilingframework/qiling.git@86c927cb329993b14e2586e04d1dd7a90deee5fb",
  "unicorn==2.1.3",
  "bumble==0.0.235",
  "rootcanal==1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
